schema_version: 1
ape:
  name: lua-ape
  binary: lua.com
commands:
  - path: []
    summary: Run the bundled Lua interpreter.
    positionals:
      - name: script
        api_name: script
        value_type: path
        required: false
        multiple: false
        help: Lua script file to execute.
      - name: arg
        api_name: args
        value_type: string
        required: false
        multiple: true
        help: Arguments passed to the Lua script.
    options:
      - flags: [-e]
        api_name: code
        value_type: string
        required: false
        multiple: true
        value_optional: false
        choices: []
        help: Execute Lua source code passed as a string. May be repeated.
      - flags: [-l]
        api_name: library
        value_type: string
        required: false
        multiple: true
        value_optional: false
        choices: []
        help: Require a library before executing the script.
      - flags: [-v]
        api_name: version
        value_type: boolean
        required: false
        multiple: false
        value_optional: false
        choices: []
        help: Print Lua version information.
      - flags: [-E]
        api_name: ignore_environment
        value_type: boolean
        required: false
        multiple: false
        value_optional: false
        choices: []
        help: Ignore environment variables.
      - flags: [-W]
        api_name: warnings
        value_type: boolean
        required: false
        multiple: false
        value_optional: false
        choices: []
        help: Turn warnings on.
operations:
  - name: run
    command: []
    execution: oneshot
    result:
      format: command
      strip: true
runtime:
  env_unset:
    - LUA_PATH
    - LUA_CPATH
    - LUA_INIT
